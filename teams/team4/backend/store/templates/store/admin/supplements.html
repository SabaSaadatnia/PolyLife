{% extends "store/base.html" %}

{% block content %}

<div class="admin-container">

<h1 class="page-title">
    مدیریت مکمل‌ها
</h1>


<div class="admin-form-card">

<h2 id="form-title">
افزودن مکمل جدید
</h2>


<input type="hidden" id="editing-id">



<div class="product-form-grid">


<div class="form-group">
<label>
نام مکمل
</label>

<input id="name">

</div>



<div class="form-group">
<label>
نام علمی
</label>

<input id="scientific_name">

</div>




<div class="form-group full-width">

<label>
توضیحات
</label>

<textarea
id="description"
rows="3"></textarea>

</div>




<div class="form-group full-width">

<label>
دوز مصرف
</label>

<textarea
id="dosage"
rows="2"></textarea>

</div>




<div class="form-group full-width">

<label>
نحوه مصرف
</label>

<textarea
id="usage_instructions"
rows="2"></textarea>

</div>




<div class="form-group full-width">

<label>
مزایا
</label>

<textarea
id="benefits"
rows="2"></textarea>

</div>




<div class="form-group full-width">

<label>
عوارض احتمالی
</label>

<textarea
id="side_effects"
rows="2"></textarea>

</div>




<div class="form-group full-width">

<label>
هشدارها
</label>

<textarea
id="warnings"
rows="2"></textarea>

</div>




<div class="form-group full-width">

<label>
مرجع FDA
</label>

<input id="fda_reference">

</div>


</div>




<button
class="btn btn-primary"
onclick="saveSupplement()">

ذخیره مکمل

</button>



<button
class="btn"
onclick="clearForm()">

پاک کردن

</button>


</div>






<table class="admin-table">

<thead>

<tr>

<th>
نام
</th>

<th>
نام علمی
</th>

<th>
توضیحات
</th>

<th>
عملیات
</th>

</tr>

</thead>


<tbody id="supplements">

</tbody>


</table>


</div>





<script>


const token =
localStorage.getItem("polylife_token");



async function api(url, options={}){


return fetch(
url,
{

...options,

headers:{

"Authorization":
"Bearer " + token,

"Content-Type":
"application/json",

...(options.headers || {})

}

}

);


}





async function loadSupplements(){


const res =
await api(
"/api/supplements/admin/"
);



const data =
await res.json();



const tbody =
document.getElementById("supplements");



tbody.innerHTML="";



data.forEach(s=>{


tbody.innerHTML += `

<tr>


<td>
${s.name}
</td>


<td>
${s.scientific_name || "-"}
</td>


<td>
${s.description.substring(0,80)}...
</td>


<td>


<button
class="btn btn-primary"
onclick='editSupplement(${JSON.stringify(s)})'>

ویرایش

</button>



<button
class="btn btn-danger"
onclick="deleteSupplement(${s.id})">

حذف

</button>


</td>


</tr>

`;

});


}







function editSupplement(s){


document.getElementById("form-title")
.innerText =
"ویرایش مکمل";



document.getElementById("editing-id")
.value =
s.id;



document.getElementById("name")
.value =
s.name || "";



document.getElementById("scientific_name")
.value =
s.scientific_name || "";



document.getElementById("description")
.value =
s.description || "";



document.getElementById("dosage")
.value =
s.dosage || "";



document.getElementById("usage_instructions")
.value =
s.usage_instructions || "";



document.getElementById("benefits")
.value =
s.benefits || "";



document.getElementById("side_effects")
.value =
s.side_effects || "";



document.getElementById("warnings")
.value =
s.warnings || "";



document.getElementById("fda_reference")
.value =
s.fda_reference || "";



window.scrollTo(
{
top:0,
behavior:"smooth"
}
);


}






function clearForm(){


document
.querySelectorAll(
".admin-form-card input, textarea"
)
.forEach(
e=>e.value=""
);



document.getElementById("editing-id")
.value="";



document.getElementById("form-title")
.innerText =
"افزودن مکمل جدید";


}







async function saveSupplement(){


const id =
document.getElementById("editing-id")
.value;



const data = {


name:
document.getElementById("name").value,


scientific_name:
document.getElementById("scientific_name").value,


description:
document.getElementById("description").value,


dosage:
document.getElementById("dosage").value,


usage_instructions:
document.getElementById("usage_instructions").value,


benefits:
document.getElementById("benefits").value,


side_effects:
document.getElementById("side_effects").value,


warnings:
document.getElementById("warnings").value,


fda_reference:
document.getElementById("fda_reference").value

};




let res;



if(id){


res =
await api(
`/api/supplements/admin/${id}/`,
{

method:"PUT",

body:
JSON.stringify(data)

}

);


}

else{


res =
await api(
"/api/supplements/admin/",
{

method:"POST",

body:
JSON.stringify(data)

}

);


}





if(res.ok){


alert(
"با موفقیت ذخیره شد"
);


clearForm();

loadSupplements();


}

else{


const error =
await res.json();


alert(
"خطا:\n"+
JSON.stringify(error)
);


}


}







async function deleteSupplement(id){


if(!confirm(
"حذف شود؟"
))
return;



const res =
await api(
`/api/supplements/admin/${id}/`,
{

method:"DELETE"

}

);



if(res.ok){

loadSupplements();

}

else{

alert(
"خطا در حذف مکمل"
);

}


}






loadSupplements();


</script>


{% endblock %}
