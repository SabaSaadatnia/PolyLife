services:
  gateway:
    image: nginx:alpine
    ports:
      - "${TEAM_PORT}:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - CORE_BASE_URL=${CORE_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - polylife
      - team

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${TEAM4_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - team
    volumes:
      - ./backend/media:/app/media

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - team4-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - team

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - team4-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - team

volumes:
  team4-db-data:
  team4-redis-data:

networks:
  polylife:
    external: true
    name: polylife_net
  team:
    internal: true